repos:
  # ── Branch discipline ──────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]

  # ── General hygiene ────────────────────────────────────────────────────────
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: mixed-line-ending
        args: [--fix, lf]

  # ── Python (backend) ───────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--select, "E,F,W,I", --ignore, "E501"]
        files: ^backend/

  # ── Dependency vulnerability scanning ─────────────────────────────────────
  # Runs pip-audit only when requirements.txt changes (makes network calls).
  # Prerequisite: brew install libpq
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (backend)
        entry: bash -c 'PATH="/opt/homebrew/opt/libpq/bin:/opt/homebrew/bin:$PATH" pip-audit -r backend/requirements.txt'
        language: system
        pass_filenames: false
        files: ^backend/requirements\.txt$
