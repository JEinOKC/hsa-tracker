version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: hsa-tracker-db-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hsatracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hsatracker}
      POSTGRES_DB: ${POSTGRES_DB:-hsatracker}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"  # Configurable host port (default 5433 to avoid conflicts)
    networks:
      - hsa-tracker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hsatracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Development mode with hot reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: hsa-tracker-backend-dev
    container_name: hsa-tracker-backend-dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=development
      - DEBUG=true
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me}
      - DATABASE_TYPE=${DATABASE_TYPE:-postgresql}
      - DATABASE_URL=${DATABASE_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_REGION=${AWS_S3_REGION:-us-east-1}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-key}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - WEBAUTHN_RP_ID=localhost
      - WEBAUTHN_RP_NAME=HSA Tracker Dev
      - WEBAUTHN_ORIGIN=http://localhost:${FRONTEND_PORT:-3001}
      - CORS_ORIGINS=http://localhost:${FRONTEND_PORT:-3001},http://localhost:5173
      - MAX_UPLOAD_SIZE_MB=10
      - ALLOWED_MIME_TYPES=image/jpeg,image/png,image/heic,application/pdf
      # Teller.io bank integration (optional, set in Doppler)
      - TELLER_APP_ID=${TELLER_APP_ID:-}
      - TELLER_CERT_B64=${TELLER_CERT_B64:-}
      - TELLER_PRIVATE_KEY_B64=${TELLER_PRIVATE_KEY_B64:-}
      - TELLER_ENV=${TELLER_ENV:-sandbox}
      # Portfolio price fetching (optional — set FINNHUB_API_KEY for live prices)
      - PRICE_PROVIDER=${PRICE_PROVIDER:-finnhub}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - REQUIRE_INVITE=${REQUIRE_INVITE:-false}
      # Web Push / VAPID (optional, set in Doppler)
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_CLAIMS_EMAIL=${VAPID_CLAIMS_EMAIL:-mailto:admin@localhost}
    volumes:
      - ./backend:/app  # Mount source code for hot reload
      - backend_cache:/root/.cache  # Cache pip packages
    ports:
      - "${BACKEND_PORT:-8001}:8000"  # Configurable host port (default 8001 to avoid conflicts)
    networks:
      - hsa-tracker-network
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # Frontend (Development mode with Vite dev server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: hsa-tracker-frontend-dev
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-8001}/api/v1
      - VITE_WEBAUTHN_RP_ID=localhost
      - VITE_TELLER_APP_ID=${TELLER_APP_ID:-}
      - VITE_TELLER_ENV=${TELLER_ENV:-sandbox}
      - VITE_VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
    volumes:
      - ./frontend:/app  # Mount source code for hot reload
      - frontend_node_modules:/app/node_modules  # Named volume so it's replaced on rebuild
    ports:
      - "${FRONTEND_PORT:-3001}:5173"  # Configurable host port (default 3001 to avoid conflicts)
    networks:
      - hsa-tracker-network
    command: npm run dev -- --host 0.0.0.0

networks:
  hsa-tracker-network:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
  backend_cache:
    driver: local
  frontend_node_modules:
    driver: local
