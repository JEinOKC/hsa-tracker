version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: hsa-tracker-db-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hsatracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hsatracker}
      POSTGRES_DB: ${POSTGRES_DB:-hsatracker}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # Expose for local development tools
    networks:
      - hsa-tracker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hsatracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Development mode with hot reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: hsa-tracker-backend-dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=development
      - DEBUG=true
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me}
      - DATABASE_TYPE=${DATABASE_TYPE:-postgresql}
      - DATABASE_URL=${DATABASE_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_REGION=${AWS_S3_REGION:-us-east-1}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-key}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - WEBAUTHN_RP_ID=localhost
      - WEBAUTHN_RP_NAME=HSA Tracker Dev
      - WEBAUTHN_ORIGIN=http://localhost:3000
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - MAX_UPLOAD_SIZE_MB=10
      - ALLOWED_MIME_TYPES=image/jpeg,image/png,image/heic,application/pdf
    volumes:
      - ./backend:/app  # Mount source code for hot reload
      - backend_cache:/root/.cache  # Cache pip packages
    ports:
      - "8000:8000"
    networks:
      - hsa-tracker-network
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # Frontend (Development mode with Vite dev server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: hsa-tracker-frontend-dev
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_WEBAUTHN_RP_ID=localhost
    volumes:
      - ./frontend:/app  # Mount source code for hot reload
      - /app/node_modules  # Prevent overwriting node_modules
    ports:
      - "3000:5173"  # Vite dev server port
    networks:
      - hsa-tracker-network
    command: npm run dev -- --host 0.0.0.0

networks:
  hsa-tracker-network:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
  backend_cache:
    driver: local
